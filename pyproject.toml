[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dunduqbot"
version = "0.1.0"
description = "A Telegram bot that sends cats"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram==3.30.0",
    "aiohttp==3.14.3",
    "redis==8.1.0",
]

[tool.setuptools]
packages = ["bot", "bot.shared"]

[tool.setuptools.package-data]
bot = ["files/*.jpg"]
